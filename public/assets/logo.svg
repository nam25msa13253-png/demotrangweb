<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Một Cửa Thông Minh">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#badgeGrad)"/>

  <!-- Ve so thu tu / ticket voi mep rang cua (perforation) -->
  <path d="M15 22 h34 a3 3 0 0 1 3 3 v3 a3 3 0 0 0 0 6 v3 a3 3 0 0 1 -3 3 h-34 a3 3 0 0 1 -3 -3 v-3 a3 3 0 0 0 0 -6 v-3 a3 3 0 0 1 3 -3 z"
        fill="#ffffff"/>

  <!-- Duong ke ranh gioi cuong ve -->
  <line x1="24" y1="24" x2="24" y2="40" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Dau check bieu thi "da phuc vu" -->
  <path d="M31 32.5 l3.2 3.4 l7-7.4" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 cham nho ben trai bieu thi hang doi -->
  <circle cx="19" cy="28" r="1.6" fill="#93c5fd"/>
  <circle cx="19" cy="32.5" r="1.6" fill="#93c5fd"/>
  <circle cx="19" cy="37" r="1.6" fill="#93c5fd"/>
</svg>
