<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiosk Tiếp nhận - Một cửa Thông minh</title>
<link rel="stylesheet" href="css/common.css?v=2" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  body { font-size: 18px; }
  .kiosk-wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  .hero { text-align: center; margin-bottom: 28px; }
  .hero h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .search-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .search-row input { flex: 1; font-size: 1.2rem; padding: 18px; }
  .quick-actions { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
  .service-list { display: flex; flex-direction: column; gap: 10px; }
  .service-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; background: #fff; border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); cursor: pointer; border: 2px solid transparent;
  }
  .service-item:hover { border-color: var(--color-primary); }
  .checklist-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; background: #f8fafc; margin-bottom: 8px; }
  .checklist-item input { width: auto; }
  .ticket-hero { text-align: center; padding: 40px 20px; }
  .ticket-number { font-size: 4.5rem; font-weight: 800; color: var(--color-primary); letter-spacing: 2px; }
  .step-nav { display:flex; justify-content: space-between; margin-top: 20px; }
  .missing-list { background: #fee2e2; border: 1.5px solid var(--color-danger); border-radius: 10px; padding: 14px; margin: 14px 0; }
  .location-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 16px; margin: 14px 0; }
  .checklist-status {
    display: flex; align-items: center; gap: 12px; border-radius: 12px; padding: 16px 18px;
    margin: 16px 0; font-weight: 700; font-size: 1.05rem;
  }
  .checklist-status .icon { font-size: 1.5rem; flex-shrink: 0; }
  .checklist-status-missing { background: #fee2e2; border: 1.5px solid var(--color-danger); color: #991b1b; }
  .checklist-status-ok { background: #dcfce7; border: 1.5px solid var(--color-success); color: #14532d; }
  .checklist-status .sub { font-weight: 500; font-size: 0.85rem; margin-top: 2px; opacity: 0.9; }

  /* Thanh tien trinh 3 buoc: giup cong dan biet dang o dau trong quy trinh lay so */
  .kiosk-stepper { display: flex; align-items: flex-start; justify-content: center; gap: 6px; margin-bottom: 30px; }
  .kiosk-step { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; }
  .kiosk-step .num {
    width: 38px; height: 38px; border-radius: 50%; background: #e2e8f0; color: #64748b;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .kiosk-step .lbl { font-size: 0.76rem; font-weight: 700; color: var(--color-text-muted); text-align: center; line-height: 1.3; }
  .kiosk-step.active .num { background: var(--color-primary); color: #fff; }
  .kiosk-step.active .lbl { color: var(--color-primary-dark); }
  .kiosk-step.done .num { background: var(--color-success); color: #fff; }
  .kiosk-step-line { width: 40px; height: 2px; background: var(--color-border); margin-top: 19px; flex-shrink: 0; }
  .kiosk-step-line.done { background: var(--color-success); }

  .skeleton-card { height: 76px; margin-bottom: 10px; }

  /* Khung chat toan trang thay the 3 man hinh rieng biet - dan dat ca 3 buoc (tim thu tuc,
     doi chieu giay to, nhan so) qua hoi thoai tu do thay vi form/nut bam co dinh. */
  .kiosk-chat-panel { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); display: flex; flex-direction: column; height: 58vh; min-height: 440px; }
  .kiosk-chat-messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .kiosk-chat-row { display: flex; gap: 10px; align-items: flex-end; }
  .kiosk-chat-row.user { justify-content: flex-end; }
  .kiosk-chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
  .kiosk-chat-bubble { max-width: 76%; padding: 14px 18px; border-radius: 16px; font-size: 1.05rem; line-height: 1.55; white-space: pre-wrap; }
  .kiosk-chat-bubble.bot { background: #f1f5f9; border-bottom-left-radius: 4px; }
  .kiosk-chat-bubble.user { background: var(--color-primary); color: #fff; border-bottom-right-radius: 4px; }
  .kiosk-chat-candidates { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .kiosk-chat-candidate-btn { text-align: left; padding: 13px 16px; border-radius: 10px; border: 1.5px solid var(--color-border); background: #fff; cursor: pointer; font-size: 1rem; }
  .kiosk-chat-candidate-btn:hover { border-color: var(--color-primary); }
  .kiosk-chat-ticket-card { background: #eff6ff; border: 2px solid var(--color-primary); border-radius: 14px; padding: 20px; text-align: center; max-width: 90%; }
  .kiosk-chat-ticket-number { font-size: 3rem; font-weight: 800; color: var(--color-primary); margin: 8px 0; letter-spacing: 1px; }
  .kiosk-chat-countdown { font-size: 0.88rem; color: var(--color-text-muted); margin-top: 12px; }
  .kiosk-chat-typing { display: flex; align-items: center; gap: 4px; padding: 4px 2px; }
  .kiosk-chat-typing span { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; animation: kioskTypingBounce 1s infinite ease-in-out; }
  .kiosk-chat-typing span:nth-child(2) { animation-delay: 0.15s; }
  .kiosk-chat-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes kioskTypingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  .kiosk-chat-input-row { display: flex; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--color-border); }
  .kiosk-chat-input-row input { flex: 1; font-size: 1.1rem; padding: 16px; border-radius: 12px; border: 1px solid var(--color-border); }
  .kiosk-chat-input-row input:disabled { background: #f1f5f9; }

  /* The Wi-Fi tra loi ngay trong khung chat (thay cho modal Wi-Fi truoc day) */
  .kiosk-chat-wifi-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.95rem; margin: 8px 0; flex-wrap: wrap; }
  .kiosk-chat-wifi-copy { border: none; background: var(--color-primary); color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; flex-shrink: 0; }
  .kiosk-chat-wifi-copy:hover { background: var(--color-primary-dark); }
  .kiosk-chat-wifi-qr { display: flex; justify-content: center; margin: 10px 0; background: #fff; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<script>window.SHOW_HEADER_CLOCK = true;</script>

<div class="kiosk-wrap">

  <div class="kiosk-stepper" id="kioskStepper">
    <div class="kiosk-step" data-step="home"><div class="num">1</div><div class="lbl">Tìm thủ tục</div></div>
    <div class="kiosk-step-line" id="stepLine1"></div>
    <div class="kiosk-step" data-step="checklist"><div class="num">2</div><div class="lbl">Đối chiếu giấy tờ</div></div>
    <div class="kiosk-step-line" id="stepLine2"></div>
    <div class="kiosk-step" data-step="ticket"><div class="num">3</div><div class="lbl">Nhận số thứ tự</div></div>
  </div>

  <div class="hero">
    <h1>Xin chào Quý công dân 👋</h1>
    <p class="text-muted">Trò chuyện với trợ lý để tìm thủ tục và lấy số thứ tự</p>
  </div>
  <!-- Bam 1 nut = gui thang cau hoi tuong ung vao khung chat ben duoi (khong mo modal rieng nua) -->
  <div class="quick-actions">
    <button class="btn btn-outline" onclick="quickAskWifi()">📶 Kết nối Wi-Fi</button>
    <button class="btn btn-outline" onclick="quickAskDvc()">📱 Nộp trực tuyến (DVC)</button>
    <button class="btn btn-outline" onclick="quickAskReentry()">🔄 Quét mã Bổ sung hồ sơ</button>
  </div>

  <!-- ================= KHUNG CHAT LAY SO (thay the 3 man hinh rieng biet truoc day, kiem luon
       vai tro huong dan Wi-Fi/DVC/Bo sung ho so - khong con modal rieng cho 3 viec nay nua) ================= -->
  <section class="kiosk-chat-panel">
    <div class="kiosk-chat-messages" id="kioskChatMessages"></div>
    <div class="kiosk-chat-input-row">
      <input id="kioskChatInput" type="text" placeholder="VD: tôi cần sang tên sổ đỏ..." autocomplete="off" />
      <button class="btn btn-primary" id="kioskChatSendBtn" onclick="sendKioskChat()">Gửi</button>
    </div>
  </section>
</div>

<!-- ================= MODAL: FORM TEMPLATE (Annotated Sample) ================= -->
<div id="formTemplateModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📋 Hướng dẫn Bổ sung Hồ sơ</h2>
    <div id="missingDocsBox"></div>
    <div id="formLocationBox"></div>
    <button class="btn btn-primary btn-block mt-16" onclick="closeModal('formTemplateModal')">Đã hiểu, tôi sẽ quay lại chat khi chuẩn bị xong</button>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/toast.js"></script>
<script src="js/kiosk.js"></script>
<script src="js/header.js"></script>
<script src="js/chatbot.js?v=2"></script>
</body>
</html>
