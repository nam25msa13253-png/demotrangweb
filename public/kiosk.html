<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiosk Tiếp nhận - Một cửa Thông minh</title>
<link rel="stylesheet" href="css/common.css?v=2" />
<link rel="stylesheet" href="css/kiosk.css" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>
<script>window.SHOW_HEADER_CLOCK = true;</script>

<div class="kiosk-wrap">

  <div class="kiosk-stepper" id="kioskStepper">
    <div class="kiosk-step active" data-step="home"><div class="num">1</div><div class="lbl">Tìm thủ tục</div></div>
    <div class="kiosk-step-line" id="stepLine1"></div>
    <div class="kiosk-step" data-step="checklist"><div class="num">2</div><div class="lbl">Đối chiếu giấy tờ</div></div>
    <div class="kiosk-step-line" id="stepLine2"></div>
    <div class="kiosk-step" data-step="ticket"><div class="num">3</div><div class="lbl">Nhận số thứ tự</div></div>
  </div>

  <!-- ================= BUOC 1: TIM THU TUC (trang rieng - chon xong se chuyen sang
       kiosk-checklist.html?serviceId=<id> de lam Buoc 2/3) ================= -->
  <div class="hero">
    <h1>Xin chào Quý công dân 👋</h1>
    <p class="text-muted">Vui lòng tìm thủ tục hành chính cần thực hiện</p>
  </div>
  <div class="search-row" id="searchRow" autocomplete="off">
    <input id="searchInput" type="text" placeholder="VD: sang tên sổ đỏ, khai sinh, đăng ký kinh doanh..." />
    <button class="btn btn-primary" onclick="searchServices()">Tìm kiếm</button>
  </div>
  <div class="quick-actions">
    <button class="btn btn-outline" onclick="openWifiModal()">📶 Kết nối Wi-Fi</button>
    <button class="btn btn-outline" onclick="openDvcModal()">📱 Nộp trực tuyến (DVC)</button>
    <button class="btn btn-outline" onclick="openReentryModal()">🔄 Quét mã Bổ sung hồ sơ</button>
  </div>
  <div id="serviceList" class="service-list"></div>
</div>

<!-- ================= MODAL: WIFI ================= -->
<div id="wifiModal" class="modal-overlay hidden">
  <div class="modal-box text-center">
    <h2>📶 Kết nối Wi-Fi miễn phí</h2>
    <p id="wifiInfo" class="text-muted"></p>
    <button class="btn btn-outline mt-16" onclick="closeModal('wifiModal')">Đóng</button>
  </div>
</div>

<!-- ================= MODAL: DVC / VNeID ================= -->
<div id="dvcModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📱 Nộp hồ sơ trực tuyến (DVC)</h2>
    <div class="field">
      <label>Mức định danh VNeID hiện tại</label>
      <select id="vneidLevel">
        <option value="1">Mức 1</option>
        <option value="2">Mức 2</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="checkVneid()">Kiểm tra điều kiện</button>
    <div id="dvcResult" class="mt-16"></div>
    <button class="btn btn-outline mt-16" onclick="closeModal('dvcModal')">Đóng</button>
  </div>
</div>

<!-- ================= MODAL: RE-ENTRY QR ================= -->
<div id="reentryModal" class="modal-overlay hidden">
  <div class="modal-box text-center">
    <h2>🔄 Quét mã QR Bổ sung hồ sơ</h2>
    <p class="text-muted">Nhập/quét mã Re-entry được cấp khi cán bộ yêu cầu bổ sung giấy tờ</p>
    <input id="reentryTokenInput" placeholder="Mã Re-entry Token" />
    <button class="btn btn-primary mt-16" onclick="submitReentry()">Xác nhận đã bổ sung</button>
    <button class="btn btn-outline mt-16" onclick="closeModal('reentryModal')">Đóng</button>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/toast.js"></script>
<script src="js/kiosk.js"></script>
<script src="js/header.js"></script>
<script src="js/chatbot.js?v=2"></script>
<script src="js/searchSuggest.js"></script>
<script>
  SearchSuggest.attach(document.getElementById('searchInput'), document.getElementById('searchRow'), {
    onSelect: (service) => goToChecklist(service.id)
  });
</script>
</body>
</html>
