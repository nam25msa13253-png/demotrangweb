<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiosk Tiếp nhận - Một cửa Thông minh</title>
<link rel="stylesheet" href="css/common.css?v=3" />
<link rel="stylesheet" href="css/kiosk.css?v=2" />
<link rel="icon" href="assets/logoKiosk-icon-transparent.png" type="image/png" />
</head>
<body data-show-header-clock="true">

<div class="kiosk-wrap">

  <div class="kiosk-stepper" id="kioskStepper">
    <div class="kiosk-step done" data-step="home"><div class="num">1</div><div class="lbl">Tìm thủ tục</div></div>
    <div class="kiosk-step-line done" id="stepLine1"></div>
    <div class="kiosk-step" data-step="checklist"><div class="num">2</div><div class="lbl">Đối chiếu giấy tờ</div></div>
    <div class="kiosk-step-line" id="stepLine2"></div>
    <div class="kiosk-step" data-step="ticket"><div class="num">3</div><div class="lbl">Nhận số thứ tự</div></div>
  </div>

  <!-- ================= BUOC 2: CHECKLIST / PRE-VALIDATION ================= -->
  <section id="screen-checklist">
    <div class="card">
      <h2 id="checklistServiceName"></h2>
      <p class="text-muted">Vui lòng đối chiếu và xác nhận các giấy tờ bạn đang có sẵn:</p>
      <div id="checklistItems"></div>
      <div id="checklistResult"></div>
      <div class="step-nav">
        <button class="btn btn-outline" data-action="goBackToSearch">← Quay lại</button>
        <button class="btn btn-primary btn-lg" data-action="submitCheckGate">Xác nhận & Lấy số thứ tự</button>
      </div>
    </div>
  </section>

  <!-- ================= BUOC 3: KET QUA CAP VE ================= -->
  <section id="screen-ticket" class="hidden">
    <div class="card ticket-hero">
      <p>Số thứ tự của bạn</p>
      <div id="ticketNumber" class="ticket-number">A-101</div>
      <p class="mt-16" id="ticketCounterName" style="font-size:1.3rem;font-weight:600;"></p>
      <p class="text-muted">Vui lòng theo dõi Bảng LED và lắng nghe Loa thông báo</p>
      <button class="btn btn-primary btn-lg mt-24" data-action="goBackToSearch">Hoàn tất</button>
    </div>
  </section>
</div>

<!-- ================= MODAL: FORM TEMPLATE (Annotated Sample) ================= -->
<div id="formTemplateModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📋 Hướng dẫn Bổ sung Hồ sơ</h2>
    <div id="missingDocsBox"></div>
    <div id="formLocationBox"></div>
    <button class="btn btn-primary btn-block mt-16" data-action="closeModal" data-args='["formTemplateModal"]'>Tôi đã chuẩn bị xong, Kiểm tra lại</button>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/toast.js"></script>
<script src="js/actionDelegate.js"></script>
<script src="js/kiosk-checklist.js"></script>
<script src="js/header.js"></script>
<script src="js/chatbot.js?v=5"></script>
</body>
</html>
