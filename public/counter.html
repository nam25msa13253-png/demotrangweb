<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giao diện Cán bộ Quầy</title>
<link rel="stylesheet" href="css/common.css?v=2" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  .active-slot { text-align: center; padding: 30px 20px; }
  .active-slot .num { font-size: 3rem; font-weight: 800; color: var(--color-primary); }
  .timer { font-size: 2.2rem; font-weight: 700; color: var(--color-danger); }
  .action-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .action-row .btn { flex: 1; min-width: 140px; }
  .conveyor-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-radius: 10px; background: #f8fafc; margin-bottom: 8px;
    border-left: 4px solid var(--color-border);
  }
  .conveyor-item.priority { border-left-color: var(--color-warning); background: #fffbeb; }
  .empty-state { text-align: center; padding: 40px; color: var(--color-text-muted); }
  /* counter.html khong dung header.js (khu vuc noi bo Can bo Quay, giong admin.html) nen
     topbar phai dinh o top:0, khong con "site-header" 64px nao ben tren de nhuong cho no. */
  .topbar { top: 0; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🖥️ Giao diện Cán bộ Quầy</h1>
  <div class="flex gap-16" style="align-items:center;">
    <span id="counterSelectWrap"></span>
    <span id="staffName" class="text-muted"></span>
    <button class="btn btn-outline" onclick="logout()">Đăng xuất</button>
  </div>
</div>

<div class="container">
  <div class="layout">
    <!-- ============ ACTIVE SLOT PANEL ============ -->
    <div class="card">
      <h3>Active Slot</h3>
      <div id="activeSlotBox" class="active-slot">
        <p class="text-muted">Chưa có vé đang xử lý</p>
      </div>
      <div id="actionRow" class="action-row"></div>
    </div>

    <!-- ============ CONVEYOR / QUEUE PANEL ============ -->
    <div class="card">
      <div class="flex-between">
        <h3>Băng chuyền Hàng đợi (FIFO)</h3>
        <span id="queueCount" class="badge badge-blue">0 vé</span>
      </div>
      <div id="conveyorList"></div>
    </div>
  </div>
</div>

<!-- ============ MODAL: YEU CAU BO SUNG ============ -->
<div id="supplementModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📝 Yêu cầu Bổ sung Hồ sơ</h2>
    <p class="text-muted">Tích chọn các giấy tờ công dân còn thiếu:</p>
    <div id="supplementChecklist"></div>
    <div class="flex gap-12 mt-16">
      <button class="btn btn-outline" onclick="closeModal('supplementModal')">Hủy</button>
      <button class="btn btn-warning" style="flex:1" onclick="submitSupplement()">Xác nhận Yêu cầu Bổ sung</button>
    </div>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/toast.js"></script>
<script src="js/wsClient.js"></script>
<script src="js/counter.js"></script>
<script src="js/chatbot.js?v=2"></script>
</body>
</html>
