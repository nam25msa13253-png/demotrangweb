services:
  - type: web
    name: smart-queue-system
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # DB MySQL/MariaDB ngoai (Render khong co MySQL managed - dung Railway/Aiven/
      # PlanetScale... roi dien thong tin ket noi vao day tren Render Dashboard).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven/PlanetScale/Railway... bat buoc SSL - de true neu dung MySQL managed ngoai.
      - key: DB_SSL
        value: "true"
      # Tuy chon: dan noi dung file ca.pem (Aiven Overview > Connection Information)
      # de verify chat CA thay vi chi ma hoa duong truyen. De trong van chay duoc.
      - key: DB_SSL_CA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
