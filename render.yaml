databases:
  - name: smart-queue-db
    plan: free
    region: singapore
    databaseName: smart_queue
    user: smart_queue_user

services:
  - type: web
    name: smart-queue-system
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Postgres managed cua chinh Render - tu tao + tu wire connection string vao day,
      # khong can dien tay host/port/user/password/SSL nhu MySQL ngoai truoc day.
      - key: DATABASE_URL
        fromDatabase:
          name: smart-queue-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
